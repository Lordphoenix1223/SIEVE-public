[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "sieve-astronomy"
version = "0.1.0"
description = "Traceable, bounded scientific candidate triage; evidence is not truth"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "astropy>=7,<8", "numpy>=2,<3"]

[project.optional-dependencies]
catalog = ["scikit-learn>=1.7,<2", "pyarrow>=20,<24"]
specialist = ["scikit-learn>=1.7,<2", "skops>=0.16,<0.17"]
photometry = ["photutils>=3,<4"]
registration = [
    "reproject>=0.18,<0.20",
]

[project.scripts]
sieve = "sieve.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.13,<1", "mypy>=1.15,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/sieve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src/sieve", "evaluation"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["astropy.*", "photutils.*", "reproject.*", "scipy.*", "sklearn.*", "pyarrow.*", "skops.*"]
ignore_missing_imports = true
